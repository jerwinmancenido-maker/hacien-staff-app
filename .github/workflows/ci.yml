name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: local_only_dummy
          MYSQL_USER: hacien
          MYSQL_PASSWORD: local_only_dummy
          MYSQL_DATABASE: hacien
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_only_dummy --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # Fake local-only values from AGENTS.md — never staging/prod or real secrets.
      DATABASE_URL: mysql://hacien:local_only_dummy@127.0.0.1:3306/hacien
      TEST_DATABASE_URL: mysql://hacien:local_only_dummy@127.0.0.1:3306/hacien_test
      SESSION_SECRET: local-only-ci-session-secret
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create throwaway test database
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          mysql -h127.0.0.1 -uroot -plocal_only_dummy -e "
            CREATE DATABASE IF NOT EXISTS hacien_test;
            GRANT ALL PRIVILEGES ON hacien_test.* TO 'hacien'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Apply migrations
        run: |
          npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
