name: CI

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      mysql:
        # Pinned to the 8.0 line: the local gate runs MySQL 8.0, and Prisma
        # 6.19's engine panics against MySQL 8.4 — CI must prove the same
        # database the gate proves.
        image: mysql:8.0
        env:
          # Throwaway credentials: this service container exists only for the
          # duration of the run and is destroyed with it. Never staging/prod
          # or real secrets.
          MYSQL_ROOT_PASSWORD: local_only_dummy
          MYSQL_USER: hacien
          MYSQL_PASSWORD: local_only_dummy
          MYSQL_DATABASE: hacien
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal_only_dummy --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # Fake local-only values from AGENTS.md — never staging/prod or real secrets.
      DATABASE_URL: mysql://hacien:local_only_dummy@127.0.0.1:3306/hacien_test
      TEST_DATABASE_URL: mysql://hacien:local_only_dummy@127.0.0.1:3306/hacien_test
      SESSION_SECRET: ci-local-dummy-secret
      APP_URL: http://localhost:3000
      # Same heap cap as the local gate scripts.
      NODE_OPTIONS: --max-old-space-size=2048

    steps:
      - uses: actions/checkout@v4
        with:
          # Gate the PR's exact head commit — not the synthetic merge commit
          # checkout would pick by default for pull_request events. (Empty on
          # push / workflow_dispatch, where the triggering ref is used.)
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: UNIT
        run: npx vitest run --project unit

      - name: reset+migrate
        # Local-gate mirror: drop + recreate hacien_test, then migrate deploy.
        # Use the mysql:8.0 image client over the network; apt mysql-client on
        # ubuntu-latest can upgrade host mysql-server and fail dpkg configure.
        run: |
          docker run --rm --network host mysql:8.0 \
            mysql -h127.0.0.1 -uroot -plocal_only_dummy -e "
              DROP DATABASE IF EXISTS hacien_test;
              CREATE DATABASE hacien_test;
              GRANT ALL PRIVILEGES ON hacien_test.* TO 'hacien'@'%';
              FLUSH PRIVILEGES;
            "
          npx prisma migrate deploy

      # The db suite runs in 3 chunks, split exactly like the local gate:
      # sorted tests/db/*.db.test.ts, contiguous chunks of ceil(N/3).
      - name: DB1
        run: |
          mapfile -t DBFILES < <(ls tests/db/*.db.test.ts)
          CHUNKSZ=$(( ( ${#DBFILES[@]} + 2 ) / 3 ))
          chunk=("${DBFILES[@]:0:CHUNKSZ}")
          echo "DB1: ${#chunk[@]} of ${#DBFILES[@]} db test files"
          npx vitest run --project db --maxWorkers=2 "${chunk[@]}"

      - name: DB2
        run: |
          mapfile -t DBFILES < <(ls tests/db/*.db.test.ts)
          CHUNKSZ=$(( ( ${#DBFILES[@]} + 2 ) / 3 ))
          chunk=("${DBFILES[@]:CHUNKSZ:CHUNKSZ}")
          echo "DB2: ${#chunk[@]} of ${#DBFILES[@]} db test files"
          npx vitest run --project db --maxWorkers=2 "${chunk[@]}"

      - name: DB3
        run: |
          mapfile -t DBFILES < <(ls tests/db/*.db.test.ts)
          CHUNKSZ=$(( ( ${#DBFILES[@]} + 2 ) / 3 ))
          chunk=("${DBFILES[@]:$((2*CHUNKSZ)):CHUNKSZ}")
          echo "DB3: ${#chunk[@]} of ${#DBFILES[@]} db test files"
          npx vitest run --project db --maxWorkers=2 "${chunk[@]}"

      - name: TSC
        run: npx tsc --noEmit

      - name: ESLINT
        run: npx eslint .

      - name: BUILD
        run: npm run build
